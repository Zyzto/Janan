name: Release

# Signed APK for this fork only. I do not own Play, F-Droid, or derdilla's key.
# Obtainium tracks the GitHub Release this job publishes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(bash ./scripts/ci/flutter_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics

      - name: Tag must match app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          eval "$(bash ./scripts/ci/app_version.sh)"
          echo "tag=$tag version=$name"
          test "$tag" = "$name"

      - name: Generate code
        run: bash ./scripts/ci/codegen.sh

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Test
        run: flutter test
        working-directory: app

  build-apk:
    name: Signed APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(bash ./scripts/ci/flutter_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: app/android
          add-job-summary: on-failure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./scripts/ci/decode_keystore.sh

      - name: Generate code
        run: bash ./scripts/ci/codegen.sh

      - name: Build release APK
        run: flutter build apk --release --flavor github
        working-directory: app

      - name: Rename APK
        run: |
          eval "$(bash ./scripts/ci/app_version.sh)"
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-github-release.apk \
            "dist/blood-pressure-monitor-${name}.apk"
          ls -lh dist/

      - name: Verify APK is not debug-signed
        run: |
          apk=$(ls dist/*.apk)
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner=$(ls "$sdk"/build-tools/*/apksigner | sort -V | tail -1)
          if [[ ! -x "$apksigner" ]]; then
            echo "apksigner not found under $sdk/build-tools" >&2
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "Release APK is still debug-signed" >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            blood-pressure-monitor-*.apk
