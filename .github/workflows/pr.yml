name: 'PR checks'
on:
  pull_request:
    types:
      - synchronize
      - labeled
      - opened
      - reopened
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "dart_test.yaml"
      - ".github/workflows/pr.yml"

jobs:
  validate-localizations:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: "assets/translations"
      - name: Check translation JSON files parse
        run: |
          python3 - <<'PY'
          import glob, json, sys
          paths = glob.glob("assets/translations/*.json")
          if not paths:
              sys.exit("no translation JSON files")
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              if not isinstance(data, dict) or not data:
                  sys.exit(f"{path} is not a non-empty object")
          print(f"checked {len(paths)} files")
          PY
  check-lints:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            dart_test.yaml
            lib
            test
            android
            ios
            assets
            integration_test
      - name: Extract Flutter version
        id: get_version
        run: |
          VERSION=$(sed -n -E "s/^[[:space:]]*flutter:[[:space:]]*([0-9]+\.[0-9.]+).*/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generate Riverpod and mocks
        run: dart run build_runner build
      - name: Analyze code
        run: flutter analyze
  update-goldens:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            dart_test.yaml
            lib
            test
            android
            ios
            assets
            integration_test
      - name: Extract Flutter version
        id: get_version
        run: |
          VERSION=$(sed -n -E "s/^[[:space:]]*flutter:[[:space:]]*([0-9]+\.[0-9.]+).*/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generate Riverpod and mocks
        run: dart run build_runner build
      - name: Update goldens
        id: gold-upd
        run: flutter test --update-goldens --fail-fast --tags gold --run-skipped
      - name: Push golden changes
        # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/evaluate-expressions-in-workflows-and-actions#example-of-failure-with-conditions
        if: ${{ steps.gold-upd.conclusion == 'success' }}
        run: |
          if [[ $(git status -s | grep png) ]]; then
              git config user.name "GitHub Action (update goldens)"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add test/
              git commit -m "Update goldens"
              git push
          else
              echo "no changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}%
  test:
    if: contains(github.event.pull_request.labels.*.name, 'auto-test')
    runs-on: ubuntu-latest
    needs: update-goldens # this is guaranteed to fail if goldens need to be updated
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            dart_test.yaml
            lib
            test
            android
            ios
            assets
            integration_test
      - name: Extract Flutter version
        id: get_version
        run: |
          VERSION=$(sed -n -E "s/^[[:space:]]*flutter:[[:space:]]*([0-9]+\.[0-9.]+).*/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generate Riverpod and mocks
        run: dart run build_runner build
      - name: Run tests
        run: flutter test --coverage
  build:
    if: contains(github.event.pull_request.labels.*.name, 'auto-build')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            dart_test.yaml
            lib
            test
            android
            ios
            assets
            integration_test
      - name: Extract Flutter version
        id: get_version
        run: |
          VERSION=$(sed -n -E "s/^[[:space:]]*flutter:[[:space:]]*([0-9]+\.[0-9.]+).*/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Generate Riverpod and mocks
        run: dart run build_runner build
      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'
        # no efficient caching possible
      - name: Build
        run: flutter build apk --debug
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: build/app/outputs/flutter-apk
